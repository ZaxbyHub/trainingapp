<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SpikeNodeBackend</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  #out { white-space: pre-wrap; background: #1b1b1b; padding: 12px; min-height: 200px; border-radius: 6px; }
  input { width: 70%; padding: 8px; }
  button { padding: 8px 14px; }
  #status { color: #8cf; margin-top: 8px; }
</style>
</head>
<body>
<h3>Spike: Node backend (issue #57)</h3>
<div>
  <input id="q" value="What two desktop backend shapes does ADR-0003 compare?" />
  <button id="ask">Ask</button>
  <button id="cancel">Cancel</button>
</div>
<div id="status"></div>
<div id="out"></div>
<script>
  const params = new URLSearchParams(location.search);
  const port = params.get('port') || '0';
  const base = `http://127.0.0.1:${port}`;
  let controller = null;
  document.getElementById('ask').onclick = async () => {
    const q = document.getElementById('q').value;
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    out.textContent = '';
    status.textContent = 'streaming...';
    controller = new AbortController();
    try {
      const res = await fetch(base + '/ask/stream', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question: q }),
        signal: controller.signal,
      });
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\r\n\r\n')) >= 0) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 4);
          if (frame.startsWith('data: ')) {
            const evt = JSON.parse(frame.slice(6));
            if (evt.token) out.textContent += evt.token;
            if (evt.done) status.textContent = evt.cancelled ? 'done (cancelled)' : 'done — grounding: ' + evt.grounding;
            if (evt.error) status.textContent = 'error: ' + evt.error;
          }
        }
      }
    } catch (e) {
      status.textContent = 'aborted/failed: ' + e;
    }
  };
  document.getElementById('cancel').onclick = () => controller && controller.abort();
  fetch(base + '/health').then(r => r.json()).then(h => { document.title += ' — ' + h.ok; });
</script>
</body>
</html>
