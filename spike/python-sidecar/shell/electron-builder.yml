appId: com.zaxbyhub.spike-python-sidecar
productName: SpikePythonSidecar
copyright: Spike for issue #57 - throwaway, deleted after ADR-0003 merges
directories:
  output: spike-release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: renderer
    to: renderer
  # PyInstaller onedir outputs are staged into these dirs before packaging.
  - from: sidecar
    to: sidecar
  - from: probe
    to: probe
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
npmRebuild: false
compression: normal
