openapi: 3.1.0
info:
  title: Document Q&A API
  version: "2.6.0"
  description: |
    RAG-based document question answering API.

    This contract is AUTHORITATIVE for the renderer (web_ui/src/lib/api) and the
    future Electron backend host (WS-B #61): both must implement/consume exactly
    these paths and schemas. `contracts/tests/run_conformance.py` verifies any
    backend against this surface (`--base-url` for a running server, `--asgi`
    for an in-process app).

    Wire notes:
    - POST /ask/stream emits Server-Sent Events (text/event-stream). Event
      separation is CRLF (`\r\n\r\n`); consumers MUST tolerate CRLF per the SSE
      spec. Terminal semantics: a stream ends with exactly one `done` payload
      (contains `sources` AND `context_length`) or one `error` payload
      (contains `error`) — never both, never neither.
    - Emitted field: `learn` (array, D6 issue #82) is emitted on ask/ask-stream
      response payloads since D6 — optional per response, empty when no
      training-slide content contributed or when grounding is "general".
      Clients MUST tolerate its absence on older servers.
    - Emitted field: `grounding` (string enum, C5 issue #72) is emitted on
      ask/ask-stream response payloads (QuestionResponse and every terminal
      `done` event, including cancelled ones) since C5. Value semantics:
      "grounded" when at least one chunk of the final evidence set (post
      version-precedence/dedup/recency ranking) scored at or above the active
      relevance floor for the current reranker/embedding pair; "general"
      otherwise (the answer came from general knowledge, or nothing was
      retrieved). The floor VALUE is owned by retrieval config; this field
      only surfaces its decision. The Python and Node backends and the
      browser orchestrator all emit the same enum.
servers:
  - url: http://127.0.0.1:8080
    description: Local loopback server (default bind)
tags:
  - name: auth
  - name: ask
  - name: ingest
  - name: documents
  - name: search
  - name: settings
  - name: ops
paths:
  /health:
    get:
      tags: [ops]
      summary: Unauthenticated liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/status:
    get:
      tags: [auth]
      summary: Authentication status and configuration
      operationId: getAuthStatus
      security: []
      responses:
        "200":
          description: Current auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
  /auth/token:
    post:
      tags: [auth]
      summary: Exchange an API key for a JWT bearer token
      operationId: createToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid API key
        "503":
          description: Authentication is not enabled on this server
  /ask:
    post:
      tags: [ask]
      summary: Ask a question (non-streaming)
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
      responses:
        "200":
          description: Answer with sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "422":
          description: Request validation failed
        "500":
          description: Processing error
        "503":
          description: Engine not initialized / no LLM backend (detail carries the model-load diagnostic when available)
  /ask/stream:
    post:
      tags: [ask]
      summary: Ask a question with SSE token streaming
      operationId: askQuestionStream
      description: |
        Emits `message` events whose `data` is JSON. Data payload variants:
        - token: `{"token": "<text>"}`
        - done:  `{"done": true, "sources": [...], "context_length": n,
                  "inference_time": t, "cancelled": true (only when cancelled),
                  "grounding": "grounded" | "general" (required, C5 issue #72),
                  "learn": [...], "citations": [...]}`
        - error: `{"error": "<message>"}` on `event: error`
        Exactly one terminal (done or error) per stream. Client disconnect
        cancels generation server-side; the cancelled stream still ends with a
        renderer-detectable done payload (`cancelled: true`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "422":
          description: Request validation failed
        "503":
          description: Engine not initialized / no LLM backend (detail carries the model-load diagnostic when available)
  /ingest:
    post:
      tags: [ingest]
      summary: Ingest documents from a server-local directory
      operationId: ingestDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Ingestion outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid directory path
        "500":
          description: Ingestion error
        "503":
          description: Engine not initialized
  /ingest/file:
    post:
      tags: [ingest]
      summary: Ingest a single uploaded file (multipart)
      operationId: ingestFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ".pdf .docx .doc .pptx .ppt .txt .md .xlsx, max 50MB"
      responses:
        "200":
          description: Ingestion outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Missing/invalid filename or unsupported type
        "413":
          description: File exceeds the 50MB limit
        "500":
          description: Ingestion error
        "503":
          description: Engine not initialized
  /ingest/batch:
    post:
      tags: [ingest]
      summary: Ingest multiple uploaded files (max 20)
      operationId: ingestBatch
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Per-file results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchIngestResponse"
        "400":
          description: More than 20 files
        "503":
          description: Engine not initialized
  /documents:
    get:
      tags: [documents]
      summary: List ingested documents
      operationId: listDocuments
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "503":
          description: Engine not initialized
    delete:
      tags: [documents]
      summary: Clear all ingested documents (destructive)
      operationId: clearDocuments
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "500":
          description: Clear error
        "503":
          description: Engine not initialized
  /search:
    post:
      tags: [search]
      summary: Search documents without generating an answer
      operationId: searchDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "422":
          description: Request validation failed
        "500":
          description: Search error
        "503":
          description: Engine not initialized
  /settings:
    get:
      tags: [settings]
      summary: Get current RAG settings (no sensitive values)
      operationId: getSettings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      tags: [settings]
      summary: Partially update RAG settings (unknown fields are ignored)
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: Cross-field validation failed (overlap >= chunk size)
  /stats:
    get:
      tags: [ops]
      summary: Engine statistics
      operationId: getStats
      responses:
        "200":
          description: Engine stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "503":
          description: Engine not initialized
  /telemetry/memory:
    get:
      tags: [ops]
      summary: Current memory telemetry snapshot and profile-downgrade state (B8, issue #66)
      description: >
        MB-denominated per-component RSS attribution plus system free/total RAM
        (snapshot), and the sustained-pressure downgrade state (downgrade).
        Component attribution semantics are documented in docs/adr/0008-memory-budget.md.
        Transport-token-guarded like every route: it reveals process memory.
        A host without a telemetry provider answers 503 (the path is known, never 404).
      operationId: getTelemetryMemory
      responses:
        "200":
          description: Current memory snapshot and downgrade state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryMemoryResponse"
        "503":
          description: Memory telemetry is not wired on this host

  /status/models:
    get:
      tags: [ops]
      summary: Per-profile inference model presence for the first-run gate (B9, issue #67)
      description: >
        Reports whether each inference profile's GGUF is staged on disk at the
        host's resolved model directory (presence means a later /ask for that
        profile will not 503; it says nothing about residency). `engine`
        distinguishes a real inference backend ('llama.cpp') from the CI/dev
        stub fixture ('stub', which answers /ask without weights and must NOT
        be treated as a blocking first-run state by clients). `profile` is the
        profile the engine would use right now (effective profile; 'auto' on
        the stub). Optional `path` is informational (staged file location).
        Transport-token-guarded like every route.
        A host without a model-status provider answers 503 (the path is
        known, never 404); the Python API surface declares this desktop-only
        route as a documented unwired 503 to keep the shared contract exact.
      operationId: getStatusModels
      responses:
        "200":
          description: Per-profile model presence and the effective profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusModelsResponse"
        "503":
          description: Model status is not wired on this host

  /packs:
    get:
      tags: [packs]
      summary: List installed knowledge pack versions (C7, issue #74)
      description: >
        One entry per installed (pack id, version) row of the pack registry,
        with the manifest display fields the renderer's Knowledge Packs panel
        shows. `active` marks the currently served version of a pack; every
        other installed version lists as superseded. `name`/`source_class`
        are nullable for registries written before those manifest fields were
        persisted (the C4 published_at additive pattern); live installs carry
        them. Transport-token-guarded like every route. A host without a pack
        manager answers 503 (the path is known, never 404).
      operationId: listPacks
      responses:
        "200":
          description: Installed pack versions (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PacksListResponse"
        "503":
          description: Pack management is not wired on this host

  /packs/install:
    post:
      tags: [packs]
      summary: Install a knowledge pack from an uploaded .zip (C7, issue #74)
      description: >
        Accepts a zipped pack folder (manifest `pack.json` at the archive
        root). The server safely extracts the archive to a temporary folder
        (relative forward-slash paths only, no symlink entries, total
        uncompressed size capped, manifest presence required) and drives the
        pack manager's folder install — schema validation, sha256
        verification, embedding compatibility and chunk ingestion all behave
        exactly as a folder install. Installation semantics (supersede,
        downgrade refusal, update-in-place) are the C2/C3 lifecycle.
        Transport-token-guarded like every route.
      operationId: installPack
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ".zip knowledge pack archive, max 50MB"
      responses:
        "200":
          description: Installation outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallPackResponse"
        "400":
          description: Missing/invalid file part or not a zip archive
        "409":
          description: Pack manager refused the install (downgrade, already active, invalid pack)
        "413":
          description: File exceeds the 50MB limit
        "503":
          description: Pack management is not wired on this host

  /packs/rollback:
    post:
      tags: [packs]
      summary: Roll a pack back to an installed older version (C7, issue #74)
      description: >
        Deactivates the currently active version of the pack and reactivates
        the requested installed version (C2/C3 lifecycle semantics). Reversible
        by rolling forward again.
      operationId: rollbackPack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRollbackRequest"
      responses:
        "200":
          description: Rollback applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRollbackResponse"
        "409":
          description: Rollback refused (target version not installed, store unavailable)
        "422":
          description: Request validation failed
        "503":
          description: Pack management is not wired on this host

  /packs/remove:
    post:
      tags: [packs]
      summary: Remove an installed pack version (or all versions) (C7, issue #74)
      description: >
        Deletes the pack's documents, chunks and registry row(s) — the
        irreversible removal of the C2/C3 lifecycle. With `version` the
        removal targets that installed version; without it every installed
        version of the pack is removed. `removed` counts the registry rows
        deleted.
      operationId: removePack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRemoveRequest"
      responses:
        "200":
          description: Removal applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRemoveResponse"
        "409":
          description: Removal refused (store unavailable)
        "422":
          description: Request validation failed
        "503":
          description: Pack management is not wired on this host

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    StatusModelsResponse:
      type: object
      required: [engine, profile, models]
      properties:
        engine:
          type: string
          enum: [stub, llama.cpp]
        profile:
          type: string
        resident:
          type: object
          description: >-
            Resident-model load state (#133). `profile` is the profile BEING
            loaded while state is 'loading', and the loaded profile afterwards.
          required: [state, profile, loadStartedAt]
          properties:
            state:
              type: string
              enum: [idle, loading, ready]
            profile:
              type: string
              nullable: true
            loadStartedAt:
              type: number
              nullable: true
              description: Epoch ms when the in-flight load started; null otherwise.
        models:
          type: object
          required: [quality, fast]
          properties:
            quality:
              type: object
              required: [present]
              properties:
                present:
                  type: boolean
                path:
                  type: string
            fast:
              type: object
              required: [present]
              properties:
                present:
                  type: boolean
                path:
                  type: string
    HealthResponse:
      type: object
      required: [status, engine_ready]
      properties:
        status:
          type: string
          enum: [ok]
        engine_ready:
          type: boolean
          description: True once the RAG engine is constructed (startup complete)
    TokenRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
    AuthStatusResponse:
      type: object
      required: [enabled, jwt_available, methods]
      properties:
        enabled:
          type: boolean
        jwt_available:
          type: boolean
        methods:
          type: array
          items:
            type: string
            enum: [bearer, api_key]
    HistoryTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: Conversation role. The server accepts any string; clients send "user" or "assistant".
        content:
          type: string
          description: Turn content. Values longer than 4000 characters are truncated server-side.
    QuestionRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        n_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 6
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/HistoryTurn"
          description: Prior conversation turns for contextualized retrieval
    QuestionResponse:
      type: object
      required: [question, answer, sources, context_length, inference_time, grounding]
      properties:
        question:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
        context_length:
          type: integer
        inference_time:
          type: number
          format: float
        citations:
          type: array
          description: Pack-attributed per-chunk citations (C4, issue #71) - one entry per retrieved chunk feeding the answer, in ranking order; pack fields are null for unpackaged documents; additive since v2.2, consumers may ignore it.
          items:
            $ref: '#/components/schemas/Citation'
        learn:
          type: array
          description: Learn-panel results (D6, issue #82) - direct training-slide hits unioned with linked slides of the cited chunks, ranked and deduped by slide, capped at MAX_LEARN_RESULTS = 5; empty when grounding is "general"; emitted on success (possibly []).
          items:
            type: object
            required: [slide_id, score, reason]
            properties:
              slide_id:
                type: string
                description: Raw Storyline slide id (TrainingPlayer.jumpToSlide input)
              title:
                type: string
                description: Slide title
              section:
                type: string
                description: Course section title the slide belongs to
              score:
                type: number
                format: float
              reason:
                type: string
                enum: [direct, linked]
              snippet:
                type: string
                description: One-line excerpt of the slide's on-screen text
              pack_id:
                type: string
                description: Owning training pack id, when known
        grounding:
          type: string
          enum: [grounded, general]
          description: Grounded/general provenance (C5, issue #72) - "grounded" when at least one chunk of the final post-ranking evidence set cleared the active relevance floor; "general" otherwise. Required on every response since C5.
    Citation:
      type: object
      description: One cited chunk with knowledge-pack attribution (C4, issue #71).
      required: [source]
      properties:
        source:
          type: string
          description: Same display value as the entries of QuestionResponse.sources
        page:
          type: integer
          nullable: true
        pack_id:
          type: string
          nullable: true
          description: Owning knowledge pack id; null for unpackaged documents
        pack_version:
          type: string
          nullable: true
          description: Active pack version the cited chunk is attributed to
        pack_published_at:
          type: string
          nullable: true
          format: date-time
          description: Pack manifest published_at (RFC3339) used by the recency prior; null for unpackaged documents
    PackInfo:
      type: object
      description: One installed knowledge pack version (C7, issue #74).
      required: [pack_id, version, name, source_class, published_at, active, supersedes]
      properties:
        pack_id:
          type: string
          description: Pack manifest id
        version:
          type: string
          description: Pack version (semver 2.0.0)
        name:
          type: string
          nullable: true
          description: Pack manifest display name; null for registries written before the field was persisted
        source_class:
          type: string
          nullable: true
          enum: [bundled, training, user]
          description: Pack manifest source class; null for registries written before the field was persisted
        published_at:
          type: string
          nullable: true
          format: date-time
          description: Pack manifest published_at (RFC3339); null when not recorded
        active:
          type: boolean
          description: True when this version is the pack's currently served version
        supersedes:
          type: array
          items:
            type: string
          description: "id@version entries this installation superseded at install time"
    PacksListResponse:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: "#/components/schemas/PackInfo"
    InstallPackResponse:
      type: object
      description: Result of installing an uploaded .zip pack (C7, issue #74). Server-filesystem paths are deliberately not exposed.
      required: [pack_id, version, docs_installed, chunks_added, superseded, warnings]
      properties:
        pack_id:
          type: string
        version:
          type: string
        docs_installed:
          type: integer
          description: Number of manifest docs installed
        chunks_added:
          type: integer
          description: Number of chunks embedded and added to the store
        superseded:
          type: array
          items:
            type: string
          description: "id@version rows deactivated by this install"
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal install notes (e.g. unresolved supersedes entries)
    PackRollbackRequest:
      type: object
      required: [pack_id, to_version]
      properties:
        pack_id:
          type: string
        to_version:
          type: string
          description: Installed version to reactivate
    PackRollbackResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    PackRemoveRequest:
      type: object
      required: [pack_id]
      properties:
        pack_id:
          type: string
        version:
          type: string
          description: Remove only this installed version; omit to remove every installed version of the pack
    PackRemoveResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: integer
          description: Number of registry rows (pack versions) deleted
    StreamEvent:
      description: |
        One SSE `data` payload (JSON). Discriminated by field presence, NOT by a
        variant field: a payload with `token` is a token event, one with `done`
        (and `sources` + `context_length`) is the terminal done event, and one
        with `error` is the terminal error event.
      oneOf:
        - type: object
          title: TokenEvent
          required: [token]
          properties:
            token:
              type: string
        - type: object
          title: DoneEvent
          required: [done, sources, context_length, grounding]
          properties:
            done:
              type: boolean
              enum: [true]
            cancelled:
              type: boolean
              description: Present and true when generation was cancelled.
            sources:
              type: array
              items:
                type: string
            context_length:
              type: integer
            inference_time:
              type: number
            learn:
              type: array
              description: Learn-panel results (D6, issue #82), same shape as QuestionResponse.learn - direct hits unioned with linked slides, ranked, deduped by slide, capped at MAX_LEARN_RESULTS = 5.
              items:
                type: object
                required: [slide_id, score, reason]
                properties:
                  slide_id:
                    type: string
                    description: Raw Storyline slide id (TrainingPlayer.jumpToSlide input)
                  title:
                    type: string
                    description: Slide title
                  section:
                    type: string
                    description: Course section title the slide belongs to
                  score:
                    type: number
                    format: float
                  reason:
                    type: string
                    enum: [direct, linked]
                  snippet:
                    type: string
                    description: One-line excerpt of the slide's on-screen text
                  pack_id:
                    type: string
                    description: Owning training pack id, when known
            citations:
              type: array
              description: Pack-attributed per-chunk citations (C4, issue #71) on the success terminal event - same shape and ordering as QuestionResponse.citations; additive since v2.2, clients must tolerate absence on older servers.
              items:
                $ref: '#/components/schemas/Citation'
            grounding:
              type: string
              enum: [grounded, general]
              description: Grounded/general provenance (C5, issue #72) on every terminal done event (success and cancelled) - same computation as QuestionResponse.grounding. Required since C5.
        - type: object
          title: ErrorEvent
          required: [error]
          properties:
            error:
              type: string
    IngestRequest:
      type: object
      required: [directory]
      properties:
        directory:
          type: string
          description: Server-local directory path
    IngestResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        documents:
          type: integer
        chunks_added:
          type: integer
        message:
          type: string
          nullable: true
    BatchFileResult:
      type: object
      required: [filename, success]
      properties:
        filename:
          type: string
        success:
          type: boolean
        chunks_added:
          type: integer
        error:
          type: string
          nullable: true
    BatchIngestResponse:
      type: object
      required: [total_files, successful, failed, results]
      properties:
        total_files:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchFileResult"
    DocumentsResponse:
      type: object
      required: [documents, total]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentInfo"
        total:
          type: integer
    DocumentInfo:
      type: object
      required: [id, chunk_count]
      properties:
        id:
          type: string
          description: Document source path
        chunk_count:
          type: integer
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        n_results:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    SearchResult:
      type: object
      required: [text, source, similarity]
      properties:
        text:
          type: string
        source:
          type: string
        similarity:
          type: number
          format: float
    SettingsResponse:
      type: object
      required:
        - chunk_size
        - chunk_overlap
        - n_results
        - min_similarity
        - temperature
        - max_tokens
        - hybrid_search
        - reranking_enabled
        - context_truncation
        - retrieval_window
        - initial_retrieval_top_k
        - rerank_top_k
        - packs_recency_half_life_months
        - packs_recency_floor_months
        - packs_recency_floor
      properties:
        chunk_size: { type: integer }
        chunk_overlap: { type: integer }
        n_results: { type: integer }
        min_similarity: { type: number }
        temperature: { type: number }
        max_tokens: { type: integer }
        hybrid_search: { type: boolean }
        reranking_enabled: { type: boolean }
        context_truncation: { type: integer }
        retrieval_window: { type: integer }
        initial_retrieval_top_k: { type: integer }
        rerank_top_k: { type: integer }
        packs_recency_half_life_months: { type: integer, minimum: 1 }
        packs_recency_floor_months: { type: integer, minimum: 1 }
        packs_recency_floor: { type: number, minimum: 0, maximum: 1 }
    SettingsUpdateRequest:
      type: object
      description: Field names are the rag_* settings keys; omitted fields are unchanged.
      properties:
        rag_chunk_size: { type: integer, minimum: 128, maximum: 8192 }
        rag_chunk_overlap: { type: integer, minimum: 0 }
        rag_n_results: { type: integer, minimum: 1, maximum: 10 }
        rag_min_similarity: { type: number, minimum: 0, maximum: 1 }
        rag_temperature: { type: number, minimum: 0, maximum: 2 }
        rag_max_tokens: { type: integer, minimum: 256, maximum: 4096 }
        rag_hybrid_search: { type: boolean }
        rag_reranking_enabled: { type: boolean }
        rag_context_truncation: { type: integer, minimum: 1 }
        rag_retrieval_window: { type: integer, minimum: 0 }
        rag_initial_retrieval_top_k: { type: integer, minimum: 1, maximum: 50 }
        rag_rerank_top_k: { type: integer, minimum: 1, maximum: 20 }
        rag_packs_recency_half_life_months: { type: integer, minimum: 1, default: 9 }
        rag_packs_recency_floor_months: { type: integer, minimum: 1, default: 18 }
        rag_packs_recency_floor: { type: number, minimum: 0, maximum: 1, default: 0.85 }
    StatsResponse:
      type: object
      required: [document_count, chunk_count, embedding_model]
      properties:
        document_count: { type: integer }
        chunk_count: { type: integer }
        embedding_model: { type: string }
        llm_backend: { type: string, nullable: true }
        documents:
          type: array
          items: { type: string }
    MemorySnapshot:
      type: object
      description: Per-component memory attribution in MB (1 MB = 1024*1024 bytes). B8 (issue #66).
      required:
        [chromiumRssMb, llmRssMb, embeddingSessionRssMb, rerankerSessionRssMb, sqliteRssMb, systemFreeMb, systemTotalMb]
      properties:
        chromiumRssMb: { type: number, description: Main-process RSS (includes native heaps) }
        llmRssMb: { type: number, description: Resident-LLM incremental footprint since host start (0 when none) }
        embeddingSessionRssMb: { type: number, description: Embedding-session thread counters (0 when not measurable) }
        rerankerSessionRssMb: { type: number, description: Reranker-worker thread counters (0 when not measurable) }
        sqliteRssMb: { type: number, description: SQLite driver heap (0 when no store is open) }
        systemFreeMb: { type: number, description: os.freemem() in MB }
        systemTotalMb: { type: number, description: os.totalmem() in MB }
    DowngradeState:
      type: object
      description: Sustained-pressure downgrade state (B8 S6; AC3 hysteresis documented in ADR-0008).
      required: [effectiveProfile, downgraded]
      properties:
        effectiveProfile:
          type: string
          enum: [quality, fast]
        downgraded:
          type: boolean
    TelemetryMemoryResponse:
      type: object
      required: [snapshot, downgrade]
      properties:
        snapshot:
          $ref: "#/components/schemas/MemorySnapshot"
        downgrade:
          $ref: "#/components/schemas/DowngradeState"
security:
  - {}
  - bearerAuth: []
  - apiKeyHeader: []
