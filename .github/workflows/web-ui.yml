name: Web UI (build, weights, packaging)

# Gates issue #20 acceptance criteria for web_ui/: typecheck, build, test, and
# packaging validation. The Python desktop suite is covered by test.yml; this
# workflow owns the JS/TS side.
#
# Issue #87 (E4): the trigger stays UNFILTERED (required checks cannot live
# behind a workflow-level paths filter — they would sit Pending forever on
# filtered PRs); scoping is at job level via the `changes` job +
# scripts/ci_paths.py (webui bucket = web_ui/** + contracts/** + this file),
# fail-open for a broken changes job.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: "path-scope classification (issue #87)"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.buckets.outputs.python }}
      webui: ${{ steps.buckets.outputs.webui }}
      conformance: ${{ steps.buckets.outputs.conformance }}
      pack: ${{ steps.buckets.outputs.pack }}
      eval: ${{ steps.buckets.outputs.eval }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute diff buckets (fail-open)
        id: buckets
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set +e
          files=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            files="$(git diff --name-only --no-renames "origin/$GITHUB_BASE_REF...HEAD")"
          else
            before="$BEFORE"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              files="$(git diff --name-only --no-renames "$before" "$GITHUB_SHA")"
            fi
          fi
          status=$?
          # Fail-open: an unusable diff base (newborn branch, force-push,
          # first commit, empty merge) runs every bucket.
          if [ "$status" -ne 0 ] || [ -z "$(printf '%s' "$files" | tr -d '[:space:]')" ]; then
            echo "diff unavailable or empty — failing open (all buckets true)"
            for b in python webui conformance pack eval; do echo "$b=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          for b in python webui conformance pack eval; do
            verdict="$(printf '%s\n' "$files" | python scripts/ci_paths.py --bucket "$b" --stdin)"; rc=$?
            if [ "$rc" -eq 0 ] && [ "$verdict" = "false" ]; then
              echo "$b=false" >> "$GITHUB_OUTPUT"
            else
              # A failing classifier (rc != 0 or no verdict) fails OPEN: a
              # broken ci_paths.py must run CI, never silently skip it.
              if [ "$rc" -ne 0 ] || [ -z "$verdict" ]; then
                echo "ci_paths.py failed for bucket $b - failing open" >&2
              fi
              echo "$b=true" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0

  web-ui:
    # Check-run name carries the web-ui identity: this job's name is a
    # required-check context (issue #87).
    name: web-ui (typecheck + build + test + packaging)
    needs: [changes]
    if: always() && needs.changes.outputs.webui != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Issue #37 R9: the embedder swapped to snowflake-arctic-embed-m-v1.5
          # (operator-acquired q8 ONNX, not in the repo). The old bge-small
          # ONNX is still LFS-tracked but no longer used; lfs:true is kept
          # harmlessly. prepare-models / validate-build now run with
          # --no-embedder because CI cannot stage the arctic q8 ONNX.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Acceptance #1: `npx tsc --noEmit` (app source) exits 0.
      - name: Typecheck (app source)
        run: npx tsc --noEmit

      # Defense-in-depth: also type-check the test tree so test-only type drift
      # is caught early. Both configs are green as of this PR; sibling PRs must
      # keep them green.
      - name: Typecheck (tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      # Acceptance #2: `npm run build` succeeds and produces dist/.
      - name: Build
        run: npm run build

      # Acceptance #3: `npx vitest run` completes without OOM and without
      # jest-dom matcher errors. Pre-existing unrelated failures are quarantined
      # via vitest.config.ts `exclude` (each named with its owning sibling PR).
      # The pool/memory tuning in vitest.config.ts prevents the worker OOM.
      - name: Test
        run: npm test

      # Acceptance #4: prepare-models succeeds with real weights present (LFS
      # pulled above) and fails loudly on LFS stubs (covered by the unit test).
      # Runs AFTER build/test so a missing-weights failure here doesn't block
      # the typecheck/build/test gates. The packaging validation below re-runs
      # build with the staged models so dist/models/ is populated.
      #
      # Issue #37 PR-1: --no-reranker because the cross-encoder q8 ONNX is an
      # operator-acquired weight (not in this repo / not under LFS). The
      # reranker is REQUIRED for production packaging (prepare-models without
      # the flag fails if the q8 ONNX is absent), but CI builds the
      # typecheck/test artifact without it. The orchestrator degrades to fused
      # results at runtime when the reranker group is excluded.
      - name: Prepare models (--no-embedder --no-reranker)
        run: npm run prepare-models -- --no-embedder --no-reranker

      # Rebuild so dist/models/ contains the staged model assets, then validate.
      # (The earlier Build step ran before prepare-models, so its dist/ has no
      # models — packaging validation needs them present.)
      - name: Rebuild with staged models
        run: npm run build

      # Packaging validation with --no-llm --no-reranker --no-embedder: the
      # browser-LLM runtime + Gemma weights, the cross-encoder q8 ONNX, AND
      # the arctic embedding q8 ONNX are all operator-acquired (not in this repo),
      # so CI enforces the ORT + wllama-WASM core only. Full validation
      # requires staged weights (see PACKAGING.md).
      - name: Validate build (--no-llm --no-reranker --no-embedder)
        run: node scripts/validate-build.mjs --no-llm --no-reranker --no-embedder

      # Regression guard for the --no-llm / --no-reranker runtime exclusions
      # (feedback F1; Issue #37 PR-1 extended to --no-reranker): verify
      # prepare-models writes the env marker(s) that make the runtime readiness
      # gate treat the excluded group(s) as "not applicable" rather than
      # "missing". The deeper end-to-end wiring (Vite inlining
      # VITE_EXCLUDE_MODEL_GROUPS into the bundle, checkPackagedModels consuming
      # it) is covered by the excluded-groups unit tests in model-manifest.test.ts
      # (run in the Test step above), which stub the env var directly and are
      # stable against minification (unlike a bundle grep).
      #
      # All three flags are passed because CI does not stage the operator-
      # acquired embedder arctic q8 ONNX, reranker q8 ONNX, or the multi-GB LLM
      # weights (see prepare-models step above). The grep accepts the comma-
      # separated form (--no-llm --no-reranker --no-embedder writes
      # "llm,reranker,embedding").
      - name: Verify prepare-models writes the exclusion markers
        run: |
          node scripts/prepare-models.mjs --no-llm --no-reranker --no-embedder
          grep -q 'VITE_EXCLUDE_MODEL_GROUPS=llm' .env.production || { \
            echo "prepare-models did not write the llm exclusion marker to .env.production"; \
            exit 1; }
          grep -q 'reranker' .env.production || { \
            echo "prepare-models did not write the reranker exclusion marker to .env.production"; \
            exit 1; }
          grep -q 'embedding' .env.production || { \
            echo "prepare-models did not write the embedding exclusion marker to .env.production"; \
            exit 1; }
          rm -f .env.production

  # Browser-mode Knowledge Pack e2e (ADR-0012, superseding the C9/ADR-0009
  # pack gate). Runs web_ui/e2e/*.spec.ts (packs-browser.spec.ts: install,
  # list, course frame on the player origin, removal) against the production
  # renderer build via vite preview. Deliberately does NOT run prepare-models:
  # CI never stages the operator-acquired weights (see the main job above),
  # and the pack install/playback path never loads model code.
  # The job `name:` below is kept byte-identical: it is a required
  # branch-protection status context (bare job name), so renaming it would
  # leave the required check pending forever.
  web-ui-e2e:
    name: web-ui e2e (browser-mode pack gate, Playwright)
    needs: [changes]
    if: always() && needs.changes.outputs.webui != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Builds the production renderer (dist/), then starts the vite preview
      # webServer pinned to 127.0.0.1:4174 (desktop's harness owns 4173) and
      # runs the browser pack spec: a fixture pack zip installs into the
      # browser pack store and lists, its course frame loads from the
      # localhost player origin (never the app origin), non-pack zips stay on
      # the generic unsupported-type path, and removal clears the row.
      - name: Run browser pack e2e
        run: npm run test:e2e

      # Lumen a11y subset (axe + tooltip overflow) of the visual harness. Reuses the
      # dist/ built by the step above; the pixel-baseline spec is Windows-only and
      # is deliberately not run here (see web_ui/e2e/visual/README.md).
      - name: Run Lumen a11y visual subset
        run: npm run test:visual:a11y:ci

      # Traces (trace: retain-on-failure) land in test-results/ — the config
      # uses the console-only list reporter, so no playwright-report/ dir is
      # ever written.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-ui-e2e-traces
          path: web_ui/test-results/
          retention-days: 7
