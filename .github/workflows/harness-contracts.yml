# Harness contract guards (PR #220 review PRR-002): the five contract specs
# added by issues #216/#219 police subjects that desktop-build.yml's paths
# filters do not trigger on — bench/** (the harness runners),
# scripts/** (the shared kill wrapper), web_ui/scripts/**, and
# .github/workflows/** + pins.json (the action-pin record). This workflow runs
# exactly those specs whenever a governed subject or the specs themselves
# change, so the guards are never inert on the surface they govern.
#
# Informational-tier today: the desktop suite runs in desktop-build's
# informational workflow, and merge-blocking promotion of the contract suite
# is issue #215's decision. This file's own action references are SHA-pinned with
# version comments per the pin record (.github/workflows/pins.json).
name: Harness Contracts

on:
  push:
    branches: [master]
    paths:
      - 'bench/**'
      - 'scripts/**'
      - 'web_ui/scripts/**'
      - '.github/workflows/**'
      - 'desktop/src/__tests__/harness-*.test.ts'
      - 'desktop/src/__tests__/acceptance-precision-contract.test.ts'
      - 'desktop/src/__tests__/packaged-smoke-contract.test.ts'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
  pull_request:
    paths:
      - 'bench/**'
      - 'scripts/**'
      - 'web_ui/scripts/**'
      - '.github/workflows/**'
      - 'desktop/src/__tests__/harness-*.test.ts'
      - 'desktop/src/__tests__/acceptance-precision-contract.test.ts'
      - 'desktop/src/__tests__/packaged-smoke-contract.test.ts'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'

permissions:
  contents: read

jobs:
  harness-contracts:
    name: harness contract guards (kill/parse/runner/pin-precision)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Harness contract guards (kill wrapper, parse, runner seams, pin precision)
        # Filename filters, not a fixed file list (final-critic): any future
        # harness-*.test.ts triggers AND runs here.
        run: npm --prefix desktop test -- src/__tests__/harness- src/__tests__/acceptance-precision-contract.test.ts
