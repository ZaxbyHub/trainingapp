name: Desktop Build

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'web_ui/**'
      - 'contracts/**'
      - 'packtool/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'web_ui/**'
      - 'contracts/**'
      - 'packtool/**'
      - '.github/workflows/desktop-build.yml'

# AC22 (issue #182): least-privilege token for the whole workflow — the
# jobs only read the repository and upload artifacts.
permissions:
  contents: read

# Cancel superseded PR runs (force-push iterations replace stale runs). Non-PR
# events get a unique group (run_id) so they never cancel or supersede each
# other: a shared group would still drop an older PENDING master/schedule run
# when a newer one queues, even with cancel-in-progress false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-build:
    name: Electron shell (unsigned NSIS x64)
    runs-on: windows-latest
    # The smoke's worst-case internal stack is ~30-31 min (both boots x
    # [DevTools wait + page-target wait + attach retries + renderer wait],
    # the ladder polls/evaluates, the relaunch poll, and the close windows).
    # 40 gives the ~8-min build prefix plus the smoke step's own 32-min
    # timeout room to land a VERDICT inside the wall (review PRR-007: with
    # the old 35-min job wall the wall beat the watchdog and killed the run
    # without dumps).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            web_ui/package-lock.json
            desktop/package-lock.json
            packtool/package-lock.json

      - name: Build renderer (web_ui)
        run: |
          npm --prefix web_ui ci --no-audit --no-fund
          npm --prefix web_ui run build

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      # critic-final-2 D4: desktop/tsconfig.json covers main/** only, so the
      # Playwright-under-Electron specs (desktop/e2e) get their own typecheck.
      - name: Typecheck the desktop e2e specs
        run: npm --prefix desktop run typecheck:e2e

      # Issue #73: packtool must be built BEFORE the desktop vitest run — the
      # c6-prebuilt-install test shells out to node packtool/dist/cli.js to
      # build a real fixture pack for the zero-re-embed install test.
      - name: Build packtool (issue #73 dependency of the desktop tests)
        run: |
          npm --prefix packtool ci --no-audit --no-fund
          npm --prefix packtool run build

      # issue #155 review PRR-006: the GPU probe's child module is a COMPILED
      # artifact (a spawned node cannot load the .ts source), so its contract
      # tests need dist/. Without this the child had ZERO coverage in any CI job:
      # `dist/` is git-excluded, so the probe-child tests skipped and every
      # behaviour in gpu-probe-child.ts could be deleted with CI green.
      - name: Compile the desktop main process
        run: npm --prefix desktop run compile

      - name: Acceptance tests (vitest, stubbed electron)
        run: npm --prefix desktop test

      - name: Storyline extractor tests (packtool, fixture-only)
        run: npm --prefix packtool test

      # E1 (issue #84): CI has no multi-GB weights (models/ is git-excluded),
      # so the staged model files are tiny deterministic fixtures. The mode is
      # loud in the manifest description AND in the artifact name — a fixture
      # installer must never be mistaken for a real-weights build.
      - name: Build installer (unsigned NSIS x64, fixture models)
        env:
          TRAININGAPP_INSTALLER_FIXTURE_MODELS: '1'
          TRAININGAPP_INSTALLER_MANIFEST_NOTE: 'MODE: fixture-models'
        run: npm --prefix desktop run desktop:build

      # E1 (issue #84) AC5: the completeness gate — the build fails when any
      # staged file is unlisted or any listed file is missing (read-only
      # compare of the staged tree against the generated manifest).
      - name: Verify installer manifest completeness (issue #84)
        run: node desktop/scripts/build-installer-manifest.mjs --stage-dir desktop/installer-resources --out desktop/installer-resources/manifest.json --verify

      - name: Verify preload is CommonJS (sandbox requirement)
        run: node desktop/scripts/verify-preload-format.mjs

      - name: Runtime preload smoke (real Electron, sandboxed bridge attach)
        run: npx --prefix desktop electron desktop/scripts/preload-runtime-smoke.cjs

      # Issue #133 (AC7, cf. #131 item 2): the only committed gate that boots
      # the PACKAGED app — win-unpacked from this job's fixture build, hash
      # embedder seam, isolated store — asserting the first-run ladder
      # (manifest clean, pack lifecycle available, required packs activated,
      # wizard completion + persistence, /packs 200). The packaged store-init
      # regression this catches (vec0 path inside app.asar) is invisible to
      # every dev-mode suite.
      # --driver cdp (issues #135/#131, closed by PR #172): the windowed Playwright
      # _electron.launch handshake intermittently never completes on windows
      # runners (both websockets connect, then launch times out — harness,
      # not app); the CDP transport drives the identical ladder over
      # --remote-debugging-port instead. Local runs keep the windowed default.
      #
      # Windowed-driver CI-gate decision (issue #180 AC19): the windowed
      # Playwright transport stays the local default with NO packaged CI gate —
      # the #135 runner handshake flake is exactly why the CDP driver exists.
      # The shared parse/selection paths ARE CI-gated (the Driver selftest
      # step below and desktop/src/__tests__/packaged-smoke-contract.test.ts); the
      # windowed launch path itself is exercised unpackaged by renderer-e2e.
      # AC18 (issue #180): the driver parse/plumbing selftest — cheap, spawns
      # nothing. Placed AFTER the installer build and immediately BEFORE the
      # smoke step below: the 133-trace check-c7 contract requires the first
      # packaged-smoke.mjs mention to follow the fixture build, and the smoke
      # run line stays exactly `--driver cdp` (131-trace C7; appending
      # --driver-selftest to it would skip the ladder entirely).
      - name: Driver selftest (packaged-smoke parse contract)
        run: node desktop/scripts/packaged-smoke.mjs --driver cdp --driver-selftest
        timeout-minutes: 5

      - name: Packaged-boot smoke (win-unpacked, hash embedder)
        run: node desktop/scripts/packaged-smoke.mjs --driver cdp
        # PRR-007: the step-level wall sits 2 min above the driver's 30-min
        # watchdog so a wedged run yields the driver's own verdict (summary +
        # both-boots dumps) instead of a wall cancellation with no evidence.
        timeout-minutes: 32

      # AC21 (issue #182): publish the fixture installer only AFTER the
      # packaged-boot smoke has passed — a red smoke must not publish an
      # artifact that looks shippable.
      - name: Upload installer artifact (fixture models - synthetic weights)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trainingapp-desktop-windows-installer-fixture
          path: desktop/desktop-release/*.exe
          if-no-files-found: error

  renderer-e2e:
    name: "Playwright under Electron (issue #67 AC1 smoke)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            web_ui/package-lock.json
            desktop/package-lock.json

      - name: Build renderer (production dist served by vite preview)
        run: |
          npm --prefix web_ui ci --no-audit --no-fund
          npm --prefix web_ui run build

      - name: Install + compile desktop (Electron binary + backend)
        run: |
          npm --prefix desktop ci --no-audit --no-fund
          npm --prefix desktop run compile

      # The training-player spec boots the app in PRODUCTION mode (app://
      # protocol, no ELECTRON_START_URL), whose unpackaged renderer root is
      # desktop/renderer - the same staging desktop:build performs.
      - name: Stage renderer for production-mode spec
        run: |
          node -e "const fs = require('fs'); fs.cpSync('web_ui/dist', 'desktop/renderer', { recursive: true })"

      - name: Run Playwright-under-Electron smoke
        run: npm --prefix desktop run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-e2e-traces
          path: |
            desktop/test-results/
            desktop/playwright-report/
          retention-days: 7

  backend-conformance:
    name: "Electron backend host vs frozen API contract (issue #61)"
    runs-on: windows-latest
    # Hard backstop: the harness fails fast on its own error paths; this
    # bounds anything that slips through (runner hangs, child not reaped).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-backend-conformance-${{ hashFiles('contracts/tests/run_conformance.py') }}
          restore-keys: |
            ${{ runner.os }}-backend-conformance-

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      # (vitest acceptance tests run in the desktop-build job above — same
      # triggers; running them twice here duplicated minutes, not coverage.)

      - name: Compile backend host
        run: npm --prefix desktop run compile

      - name: Install conformance suite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run API contract conformance against the Electron-hosted backend
        run: node desktop/scripts/run-conformance-host.mjs

  store-interop:
    name: "Node/Python sqlite-vec store interop (issue #63)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-store-interop-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-store-interop-

      - name: Install desktop dependencies (better-sqlite3 + sqlite-vec)
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Install sqlite-vec + jsonschema + pytest (Python side)
        run: |
          python -m pip install --upgrade pip
          pip install "sqlite-vec==0.1.9" "jsonschema[format]>=4.18,<5.0.0" pytest

      - name: Interop — Node writes, Python reads
        run: python contracts/tests/store-interop/run_interop.py --direction "node->python"

      - name: Interop — Python writes, Node reads
        run: python contracts/tests/store-interop/run_interop.py --direction "python->node"

      - name: Pack schema — validator + fixtures suite (issue #68)
        run: python -m pytest contracts/tests/test_pack_schema.py -q

      - name: Pack feed schema — fixtures suite (issue #88)
        run: python -m pytest contracts/tests/test_pack_feed_schema.py -q

      - name: Cross-backend pack parity - Node vs Python chunk-id sets (issue #70 AC1)
        run: |
          python -m pip install chromadb
          python contracts/tests/test_pack_parity.py

  # The packtool fixture-pack job (build-docs + verify, issue #73) moved to
  # .github/workflows/conformance.yml as pack-fixture-build and gained the
  # build-storyline leg (issue #87): the fixture-pack signal now runs
  # path-scoped via the `pack` bucket instead of living inside this
  # 30-minute Windows job. This workflow's own `paths:` filter is unchanged
  # and still includes `packtool/**`, so packtool-only diffs still run it.
