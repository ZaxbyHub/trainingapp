name: Conformance

# Issue #87 (E4): path-scoped conformance + pack-fixture signals, required
# for merge. The workflow trigger itself is deliberately UNFILTERED: a
# workflow-level `paths:` filter leaves required checks Pending forever on
# filtered PRs (GitHub docs, "Handling skipped but required checks"). Path
# scoping lives at job level — jobs skipped by a conditional report Success,
# so required checks stay satisfiable. The `changes` job fails OPEN (errors
# emit all-true) and consumers use `!= 'false'` polarity so a broken changes
# job can only make CI run more, never silently less.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded PR runs. Non-PR events get a unique group (run_id) so a newer
# queued run never supersedes an older pending master run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: "path-scope classification (issue #87)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.buckets.outputs.python }}
      webui: ${{ steps.buckets.outputs.webui }}
      conformance: ${{ steps.buckets.outputs.conformance }}
      pack: ${{ steps.buckets.outputs.pack }}
      eval: ${{ steps.buckets.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute diff buckets (fail-open)
        id: buckets
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set +e
          files=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            files="$(git diff --name-only --no-renames "origin/$GITHUB_BASE_REF...HEAD")"
          else
            before="$BEFORE"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              files="$(git diff --name-only --no-renames "$before" "$GITHUB_SHA")"
            fi
          fi
          status=$?
          # Fail-open: an unusable diff base (newborn branch, force-push,
          # first commit, empty merge) runs every bucket.
          if [ "$status" -ne 0 ] || [ -z "$(printf '%s' "$files" | tr -d '[:space:]')" ]; then
            echo "diff unavailable or empty — failing open (all buckets true)"
            for b in python webui conformance pack eval; do echo "$b=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          for b in python webui conformance pack eval; do
            verdict="$(printf '%s\n' "$files" | python scripts/ci_paths.py --bucket "$b" --stdin)"; rc=$?
            if [ "$rc" -eq 0 ] && [ "$verdict" = "false" ]; then
              echo "$b=false" >> "$GITHUB_OUTPUT"
            else
              # A failing classifier (rc != 0 or no verdict) fails OPEN: a
              # broken ci_paths.py must run CI, never silently skip it.
              if [ "$rc" -ne 0 ] || [ -z "$verdict" ]; then
                echo "ci_paths.py failed for bucket $b - failing open" >&2
              fi
              echo "$b=true" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0

  python-conformance:
    name: python-conformance
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [changes]
    # Issue #319 AC3: the pip-audit advisory gate must run on EVERY push to
    # master regardless of the diff bucket (issue #277 AC5's stated visibility
    # was only half-implemented); pull requests keep the conformance-bucket
    # scoping. The push clause is pinned by tests/test_master_push_advisory_scan.py
    # and the sanctioned wiring override in tests/test_ci_paths.py.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.conformance != 'false') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/requirements.txt', '.github/ci/llama-cpp-constraints.txt', '.github/ci/llama-cpp-wheel.txt') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      # llama-cpp-python publishes only sdists on PyPI; an unpinned range floats
      # to a release with no cached wheel and compiles from source (~8 min).
      # Install the pinned prebuilt wheel from the project's CPU wheel index
      # FIRST (index scoped to this one command, never the requirements install).
      - name: Install prebuilt llama-cpp-python wheel
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes --index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r .github/ci/llama-cpp-wheel.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c .github/ci/llama-cpp-constraints.txt
          pip install httpx
          pip install pytest
          python -m pip check

      # Issue #277 AC5: current-database advisory scan over the INSTALLED
      # environment (the range-resolving `pip-audit -r` ran past 10 minutes
      # on the reference host, and auditing what CI actually installed is the
      # honest scan). Ignores come ONLY from .github/pip-audit-ignore.json —
      # every entry owner-named with an expiry that fails the required
      # context red once passed. Safety (whose bundled database could not
      # see CVE-2026-68770) was removed from the security job by this
      # workstream. No continue-on-error: a new Python advisory on this
      # manifest must block.
      - name: Python advisory audit (pip-audit, issue #277)
        run: |
          pip install pip-audit==2.10.1
          python scripts/pip_audit_gate.py

      - name: "Check test collection completeness (issue #51 guardrail)"
        run: python scripts/check_test_collection.py

      - name: "Run the CI wiring guardrail (test_ci_paths.py)"
        # Review PRR-003: the contract-family gate's external defender lives
        # here, in a REQUIRED context, so a diff that deletes the contract
        # step from security.yml (whose only other gate lives inside that
        # very step) still gets a red required check. This suite also pins
        # the bucket classifier and workflow wiring end to end.
        run: python -m pytest tests/test_ci_paths.py -q

      - name: Run API contract conformance suite
        run: python contracts/tests/run_conformance.py --asgi api_server:app

  pack-fixture-build:
    name: pack-fixture-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.pack != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: packtool/package-lock.json

      - name: Install + build packtool
        run: |
          npm --prefix packtool ci --no-audit --no-fund
          npm --prefix packtool run build

      # Issue #319 AC1: the desktop workbook child must extract byte-identically
      # to packtool. The committed parity fixture + golden are the shared
      # contract; this REQUIRED job re-proves the packtool side on every
      # packtool/contracts diff (the desktop side is pinned by the frozen
      # acceptance spec i289-xlsx-parse-isolation.test.ts T8).
      - name: Verify xlsx extraction parity (issue #319)
        run: node packtool/scripts/verify-xlsx-parity.mjs

      # Issue #73 (C6) leg, moved from desktop-build.yml: build-docs fixture
      # from the committed source docs. --embedder hash: CI checkouts carry
      # no model weights and the deterministic embedder needs none.
      - name: Build the docs fixture pack (build-docs)
        run: |
          mkdir -p knowledge-pack-fixture
          node packtool/dist/cli.js build-docs contracts/fixtures/source-docs/ --id test-pack --version 1.0.0 --embedder hash -o knowledge-pack-fixture/out.zip

      - name: Verify the docs fixture pack
        run: node packtool/dist/cli.js verify knowledge-pack-fixture/out.zip

      # Issue #87 (E4): the build-storyline leg — assemble a publish dir
      # from committed parts (the mini fixture has no player asset, so the
      # committed stub supplies story.html; see 02-reproduction.md R8), then
      # build + verify through the real CLI, exactly as a pack author would.
      - name: Assemble the storyline fixture publish dir
        run: |
          mkdir -p storyline-fixture/pub
          cp -r tests/fixtures/storyline-mini/. storyline-fixture/pub/
          cp tests/fixtures/storyline-mini-story-html-stub.html storyline-fixture/pub/story.html

      - name: Build the storyline fixture pack (build-storyline)
        run: node packtool/dist/cli.js build-storyline storyline-fixture/pub --id ci-storyline-fixture --version 1.0.0 --embedder hash --out storyline-fixture/out.zip

      - name: Verify the storyline fixture pack
        run: node packtool/dist/cli.js verify storyline-fixture/out.zip

      - name: Upload the docs fixture pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-pack-fixture
          path: knowledge-pack-fixture/out.zip
          if-no-files-found: error

      - name: Upload the storyline fixture pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storyline-pack-fixture
          path: storyline-fixture/out.zip
          if-no-files-found: error
