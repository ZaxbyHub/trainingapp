name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit "safety<3.0"

      - name: Run Bandit
        run: |
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f json -o bandit-report.json
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f screen
        continue-on-error: true

      - name: Run Safety
        run: |
          safety check -r requirements.txt --policy-file .safety-policy.yml

      - name: Upload security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30
