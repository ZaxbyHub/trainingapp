name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

# Cancel superseded PR runs (force-push iterations replace stale runs). Non-PR
# events get a unique group (run_id) so they never cancel or supersede each
# other: a shared group would still drop an older PENDING master/schedule run
# when a newer one queues, even with cancel-in-progress false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install security tools
        # issue #277: Safety removed — its bundled database cannot see the
        # critical sentence-transformers advisory (CVE-2026-68770). The
        # current-database scanner (pip-audit) runs in the required
        # python-conformance job with an owned expiring ignore instead
        # (see .github/workflows/conformance.yml and issue #277 AC5).
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f json -o bandit-report.json
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f screen
        continue-on-error: true

      # Issue #215 (batch-143-203-204-212-213-215): the contract-spec family is
      # MERGE-BLOCKING here — `security` is one of the five required contexts
      # (see README's required-checks table) and this job reports on every PR,
      # so a red contract pin cannot merge silently. The roster is the closed
      # contract family (pinned by ci-gate-required-contract.test.ts, which
      # also pins this step's unconditionality). Issue #233 rostered the five
      # PR #230 lifecycle pins (backend-env-repo-root-contract,
      # backend-lifecycle-capture-once-census, backend-memory-tick-lifecycle,
      # i199-backend-surface-lifecycle, reranker-generation-lifecycle), the
      # separate i230-resolver-env-parity pin, the two frozen acceptance
      # surfaces, and — review PRR-008 (pr242) — the two #232-residual frozen
      # specs i230-host-stop-profile-reset and i230-sampler-liveness, and —
      # issues #201/#207/#208/#209/#210 (trace
      # 201-207-208-209-210-test-gate-integrity) — the log-line contract
      # sweep (logline-contract-sweep.test.ts) and its acceptance-battery
      # meta-guard (acceptance-battery-precision.test.ts), rostered per the
      # same PRR-008 precedent, and — review PRR-018/015 (pr255) — the trace
      # 248-41 diagnostics specs diagnostics-redact-parity,
      # diagnostics-logging, diagnostics-console-composition and the frozen
      # -t token re-driver diagnostics-acceptance-precision.
      # (registry: desktop/src/__tests__/contract-family-registry.ts).
      - name: Set up Node for the contract-spec family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dev dependencies (contract specs)
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Run the contract-spec family (merge-blocking, issue #215)
        run: >
          npm --prefix desktop test --
          src/__tests__/embed-seam-contract.test.ts
          src/__tests__/embed-threads-clamp-contract.test.ts
          src/__tests__/embed-constants-parity.test.ts
          src/__tests__/pack-twin-parity.test.ts
          src/__tests__/ci-gate-required-contract.test.ts
          src/__tests__/contract-spec-conventions.test.ts
          src/__tests__/backend-env-repo-root-contract.test.ts
          src/__tests__/backend-lifecycle-capture-once-census.test.ts
          src/__tests__/backend-memory-tick-lifecycle.test.ts
          src/__tests__/i199-backend-surface-lifecycle.test.ts
          src/__tests__/reranker-generation-lifecycle.test.ts
          src/__tests__/i230-resolver-env-parity.test.ts
          src/__tests__/i230-host-stop-profile-reset.test.ts
          src/__tests__/i230-sampler-liveness.test.ts
          src/__tests__/roster-exclusion-evidence-contract.test.ts
          src/__tests__/frozen-recipe-replay-contract.test.ts
          src/__tests__/logline-contract-sweep.test.ts
          src/__tests__/acceptance-battery-precision.test.ts
          src/__tests__/diagnostics-redact-parity.test.ts
          src/__tests__/diagnostics-logging.test.ts
          src/__tests__/diagnostics-console-composition.test.ts
          src/__tests__/diagnostics-acceptance-precision.test.ts
          src/__tests__/settings-openapi-parity.test.ts

      # Issue #276/#277 (Workstreams G+D): the new Python guards for the
      # dependency-currency contract and the advisory-gate scripts run in the
      # UNBUCKETED required `security` job so they bind on every PR, not only
      # in the bucket-scoped python-conformance job (a skipped required job
      # counts as passing — epic #284 guard-binding rule). Created by the
      # first of G/E/F/H to land (this PR); later workstreams append their
      # guard files to the roster. Pins match the local validation versions.
      - name: Audit guards (issue #276/#277 guards, merge-blocking)
        run: |
          pip install pytest==9.1.1 pyyaml==6.0.2 packaging==26.2
          python -m pytest \
            tests/test_vendored_xlsx.py \
            tests/test_dependency_currency.py \
            tests/test_extractor_twins.py \
            tests/test_electron_fuses.py \
            tests/test_dependency_audit_gate.py \
            tests/test_dependabot_config.py \
            tests/test_runtime_pins.py \
            tests/test_python_advisory_step.py \
            tests/test_ci_paths.py -q

      - name: Upload security report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # Issue #277 AC1 (Workstream D): REQUIRED advisory gate over the three
  # shipped JavaScript graphs (web_ui, desktop, packtool). Unfiltered triggers
  # — a paths filter would leave a required context Pending forever on PRs
  # outside its scope (#87 precedent). No continue-on-error: this is the gate
  # the audit found missing. npm's exit code does NOT distinguish findings
  # from a registry outage (both exit 1), so collection and classification
  # live in scripts/audit_gate.py (payload-based, two retries, fail-closed);
  # HIGH/CRITICAL advisories are cleared only by unexpired owner-named
  # entries in .github/audit-allowlist.json — which is the full set of what
  # remains after Workstream G's currency fixes, i.e. the three semver-major
  # families (sharp via transformers, simple-git family cleared non-major,
  # vitest family via tinypool). Electron is a devDependency but ships, so
  # the gate audits the FULL graph (no --omit=dev).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web_ui/package-lock.json
            desktop/package-lock.json
            packtool/package-lock.json

      - name: Gate web_ui
        run: python scripts/audit_gate.py --package-dir web_ui --allowlist .github/audit-allowlist.json

      - name: Gate desktop
        run: python scripts/audit_gate.py --package-dir desktop --allowlist .github/audit-allowlist.json

      - name: Gate packtool
        run: python scripts/audit_gate.py --package-dir packtool --allowlist .github/audit-allowlist.json
