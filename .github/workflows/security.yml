name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

# Cancel superseded PR runs (force-push iterations replace stale runs). Non-PR
# events get a unique group (run_id) so they never cancel or supersede each
# other: a shared group would still drop an older PENDING master/schedule run
# when a newer one queues, even with cancel-in-progress false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit "safety<3.0"

      - name: Run Bandit
        run: |
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f json -o bandit-report.json
          bandit -r . -x tests/,__pycache__/,*.pyc,.swarm/,.pytest_cache/,doc_qa_db/ -f screen
        continue-on-error: true

      # Issue #215 (batch-143-203-204-212-213-215): the contract-spec family is
      # MERGE-BLOCKING here — `security` is one of the five required contexts
      # (see README's required-checks table) and this job reports on every PR,
      # so a red contract pin cannot merge silently. The roster is the closed
      # contract family (pinned by ci-gate-required-contract.test.ts, which
      # also pins this step's unconditionality).
      - name: Set up Node for the contract-spec family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dev dependencies (contract specs)
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Run the contract-spec family (merge-blocking, issue #215)
        run: >
          npm --prefix desktop test --
          src/__tests__/embed-seam-contract.test.ts
          src/__tests__/embed-threads-clamp-contract.test.ts
          src/__tests__/embed-constants-parity.test.ts
          src/__tests__/pack-twin-parity.test.ts
          src/__tests__/ci-gate-required-contract.test.ts
          src/__tests__/contract-spec-conventions.test.ts

      - name: Run Safety
        run: |
          safety check -r requirements.txt --policy-file .safety-policy.yml

      - name: Upload security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30
