# electron-builder configuration for the TrainingApp desktop shell (issue #59).
# Unsigned NSIS x64 installer; code signing arrives with Workstream E5 (#88).
appId: com.zaxbyhub.trainingapp
productName: TrainingApp
directories:
  # NOT "release": a same-name output dir can stay file-locked on Windows dev
  # machines by editor/workspace indexers that scanned a previous build's
  # win-unpacked\resources\app.asar (observed with ZCode's indexer), which
  # makes electron-builder's cleanup unlink fail with EBUSY. Fresh dir = no
  # stale handles; CI artifact glob matches this path.
  output: desktop-release
files:
  - dist/**/*
  - package.json
  # issue #155: the CUDA backend packages are excluded from the installer.
  # Nothing can select them: the GPU decision resolves to 'vulkan' or 'cpu' only,
  # and the auto probe passes exclude: ['cuda'] because these packages are not
  # shipped. They measured ~510 MB unpacked, so carrying them is pure weight.
  # The exclusion is declared here rather than in npm config so `npm ci` still
  # installs everything the dev tree and the vulkan path need.
  - '!**/node_modules/@node-llama-cpp/win-x64-cuda/**'
  - '!**/node_modules/@node-llama-cpp/win-x64-cuda-ext/**'
  # PR #159 review PRR-033: win-arm64 is excluded for the SAME reason as the CUDA
  # packages - nothing can select it. `win.target.arch` below is x64-only, and
  # node-llama-cpp declares win-arm64 with `cpu: [arm64, x64]`, so `npm ci`
  # installs it on an x64 machine and electron-builder ships it (measured 22 MB).
  # Leaving it in while removing 510 MB of CUDA applied the weight rule unevenly.
  - '!**/node_modules/@node-llama-cpp/win-arm64/**'
# The desktop:build script copies web_ui/dist into renderer/ before packaging
# (stage-installer-resources.mjs excludes the weight files duplicated into
# installer-resources); the main process serves it from <resourcesPath>/web_ui
# via the app:// protocol.
# E1 (issue #84): the installer's staged resources land at the resources root —
# <resourcesPath>/{manifest.json, models/<group>/<id>/…, packs/<classDir>/
# <packId>-<version>/…, docs/licenses.md} — exactly what resolveManifestPath,
# verifyManifest, packEntryDir, and licensesPath read.
extraResources:
  - from: renderer
    to: web_ui
  - from: installer-resources/models
    to: models
  - from: installer-resources/packs
    to: packs
  - from: installer-resources/docs
    to: docs
  - from: installer-resources/manifest.json
    to: manifest.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  # Keep false until a deliberate uninstall-data policy exists (#84): true
  # would silently wipe %APPDATA%/TrainingApp on uninstall.
  deleteAppDataOnUninstall: false
npmRebuild: false
compression: normal
# Native addons and wasm/worker assets cannot load from inside the asar
# archive: unpack the inference/embedding/extraction runtimes (B4/B6).
# sqlite-vec*/better-sqlite3 are pinned explicitly (#133): vec0.dll's path
# is resolved via require.resolve and handed to native loadExtension, so the
# app.asar.unpacked twin must exist even if smart-unpack heuristics change.
asarUnpack:
  - '**/node_modules/@huggingface/transformers/**'
  - '**/node_modules/onnxruntime*/**'
  - '**/node_modules/pdfjs-dist/**'
  - '**/node_modules/sqlite-vec*/**'
  - '**/node_modules/better-sqlite3/**'
  # issue #155: the llama.cpp compute backends are pinned explicitly for the
  # same reason sqlite-vec is above. They used to reach disk only through
  # electron-builder's implicit native-module heuristic; the Vulkan binary is
  # now LOADED AT RUNTIME by the GPU probe, so relying on a heuristic that
  # electron-builder may change would silently turn every packaged install
  # back into CPU-only. The CPU backend is pinned alongside it because the
  # probe's CPU fallback path must work even where no GPU binary exists.
  - '**/node_modules/@node-llama-cpp/win-x64-vulkan/**'
  - '**/node_modules/@node-llama-cpp/win-x64/**'
