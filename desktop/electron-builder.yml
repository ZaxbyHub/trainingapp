# electron-builder configuration for the TrainingApp desktop shell (issue #59).
# Unsigned NSIS x64 installer; code signing arrives with Workstream E5 (#88).
appId: com.zaxbyhub.trainingapp
productName: TrainingApp
directories:
  # NOT "release": a same-name output dir can stay file-locked on Windows dev
  # machines by editor/workspace indexers that scanned a previous build's
  # win-unpacked\resources\app.asar (observed with ZCode's indexer), which
  # makes electron-builder's cleanup unlink fail with EBUSY. Fresh dir = no
  # stale handles; CI artifact glob matches this path.
  output: desktop-release
files:
  - dist/**/*
  - package.json
# The desktop:build script copies web_ui/dist into renderer/ before packaging
# (stage-installer-resources.mjs excludes the weight files duplicated into
# installer-resources); the main process serves it from <resourcesPath>/web_ui
# via the app:// protocol.
# E1 (issue #84): the installer's staged resources land at the resources root —
# <resourcesPath>/{manifest.json, models/<group>/<id>/…, packs/<classDir>/
# <packId>-<version>/…, docs/licenses.md} — exactly what resolveManifestPath,
# verifyManifest, packEntryDir, and licensesPath read.
extraResources:
  - from: renderer
    to: web_ui
  - from: installer-resources/models
    to: models
  - from: installer-resources/packs
    to: packs
  - from: installer-resources/docs
    to: docs
  - from: installer-resources/manifest.json
    to: manifest.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  # Keep false until a deliberate uninstall-data policy exists (#84): true
  # would silently wipe %APPDATA%/TrainingApp on uninstall.
  deleteAppDataOnUninstall: false
npmRebuild: false
compression: normal
# Native addons and wasm/worker assets cannot load from inside the asar
# archive: unpack the inference/embedding/extraction runtimes (B4/B6).
# sqlite-vec*/better-sqlite3 are pinned explicitly (#133): vec0.dll's path
# is resolved via require.resolve and handed to native loadExtension, so the
# app.asar.unpacked twin must exist even if smart-unpack heuristics change.
asarUnpack:
  - '**/node_modules/@huggingface/transformers/**'
  - '**/node_modules/onnxruntime*/**'
  - '**/node_modules/pdfjs-dist/**'
  - '**/node_modules/sqlite-vec*/**'
  - '**/node_modules/better-sqlite3/**'
